name: Public kit checks
on:
  push:
  pull_request:
jobs:
  examples-and-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pyyaml
      - run: python -m compileall -q examples
      - run: python -m pytest -q tests/test_public.py
      - name: Scan tracked files for likely secrets
        run: |
          if git grep -nE '(ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY)' -- . ':!LICENSE'; then
            echo 'Potential secret detected' >&2
            exit 1
          fi
      - name: Confirm generated PDF handbooks are tracked
        run: test -s docs/pdf/reins-pilot-en.pdf && test -s docs/pdf/reins-pilot-zh-CN.pdf
  latex-handbooks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install XeLaTeX and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-lang-chinese texlive-latex-extra fonts-noto-cjk
      - name: Build both source handbooks
        run: |
          mkdir -p tmp/pdfs
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -output-directory=tmp/pdfs docs/tex/reins-pilot-en.tex
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -output-directory=tmp/pdfs docs/tex/reins-pilot-zh-CN.tex
          test -s tmp/pdfs/reins-pilot-en.pdf
          test -s tmp/pdfs/reins-pilot-zh-CN.pdf
